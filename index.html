<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Curly Toothbrush</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Curly Teeth">
<meta name="theme-color" content="#5cc8c0">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3b8f8a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#9fe6df,#c9f3ee 60%,#ffd6e7 60%,#ffc2da);font-family:"Chalkboard SE","Comic Sans MS",system-ui,sans-serif;z-index:5}
  #start h1{font-size:9vmin;margin:0 0 2vmin;color:#fff;text-align:center;text-shadow:0 .6vmin 0 #2f7f7a}
  #start .big{font-size:20vmin;line-height:1}
  #play{margin-top:4vmin;font-size:11vmin;padding:2.5vmin 11vmin;border:none;border-radius:8vmin;background:#ffcc33;color:#5a3a00;box-shadow:0 1.2vmin 0 #c99400;font-family:inherit}
  #play:active{transform:translateY(1vmin);box-shadow:0 .2vmin 0 #c99400}
  #turn{display:none;position:fixed;inset:0;z-index:9;background:#5cc8c0;color:#fff;flex-direction:column;align-items:center;justify-content:center;font-family:"Chalkboard SE","Comic Sans MS",sans-serif}
  #turn .ph{font-size:30vmin;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){#turn{display:flex}}
</style>
</head>
<body>
<div id="turn"><div class="ph">📱</div><div style="font-size:14vmin">🔄 🐶</div></div>
<div id="start">
  <div class="big">🐶🪥✨</div>
  <h1>Curly Toothbrush</h1>
  <button id="play">▶</button>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const ICON = Q.has("icon");
const W = 1024, H = 768;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  if (ICON) { cv.width = 512; cv.height = 512; cv.style.width = "512px"; cv.style.height = "512px"; return; }
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();
const worldT = () => ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
// ================= sound =================
let ac = null, master = null, noiseBuf = null;
function initAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = "sine", vol = 0.25, slide = 0, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + Math.max(0, delay), o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol, type = "lowpass", delay = 0, attack = 0.01) {
  if (!ac) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
const sfx = {
  woof: () => { tone(420, 0.12, "sawtooth", 0.12, -200); tone(380, 0.12, "sawtooth", 0.12, -180, 0.18); },
  yip: () => { tone(700, 0.1, "sawtooth", 0.09, -250); },
  giggle: () => { for (let i = 0; i < 5; i++) tone(900 + (i % 2) * 180 + Math.random() * 60, 0.08, "triangle", 0.1, 120, i * 0.09); },
  scrub: () => noise(0.12, 2600 + Math.random() * 1500, 0.06, "bandpass"),
  ding: (n = 0) => { tone(1047 * Math.pow(1.06, n), 0.3, "sine", 0.18); tone(1568 * Math.pow(1.06, n), 0.35, "sine", 0.1, 0, 0.06); },
  ping: (n = 0) => { tone(1200 + n * 90, 0.25, "triangle", 0.16); tone(2400 + n * 180, 0.15, "sine", 0.05, 0, 0.03); },
  sparkle: () => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.18, "sine", 0.1, 0, i * 0.06)); },
  pop: () => tone(500 + Math.random() * 300, 0.07, "sine", 0.12, 400),
  water: () => noise(0.25, 900 + Math.random() * 400, 0.08, "lowpass"),
  gargle: () => { for (let i = 0; i < 8; i++) tone(180 + Math.random() * 60, 0.07, "square", 0.05, 30, i * 0.07); },
  spit: () => { noise(0.18, 1800, 0.25, "bandpass"); tone(300, 0.15, "sine", 0.15, -150); },
  splash: () => { noise(0.4, 1200, 0.2, "lowpass", 0.05); [900, 1200, 800].forEach((f, i) => tone(f, 0.08, "sine", 0.06, 300, 0.1 + i * 0.07)); },
  boing: () => tone(260, 0.5, "sine", 0.25, 500),
  step: () => tone(160, 0.05, "sine", 0.06),
  whoosh: () => noise(0.4, 1500, 0.12, "bandpass", 0, 0.15),
  yay: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.25, "triangle", 0.2, 0, i * 0.12)); },
  door: () => { tone(880, 0.2, "sine", 0.15); tone(660, 0.35, "sine", 0.15, 0, 0.2); },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SONG = { step: 0.3, bass: [48, 0, 55, 0, 53, 0, 55, 0], mel: [72, 76, 79, 76, 77, 0, 74, 0, 72, 76, 79, 84, 81, 0, 79, 0], bv: 0.045, mv: 0.03 };
let songOn = false, songStep = 0, nextNote = 0;
function musicTick() {
  if (!ac || !songOn) return;
  while (nextNote < ac.currentTime + 0.15) {
    const d = nextNote - ac.currentTime, b = SONG.bass[songStep % 8], m = SONG.mel[songStep % 16];
    if (b) tone(mtof(b), 0.5, "triangle", SONG.bv, 0, d);
    if (m) tone(mtof(m), 0.4, "sine", SONG.mv, 0, d);
    nextNote += SONG.step; songStep++;
  }
}
// ================= voice =================
let lastSay = "";
function say(t, opt = {}) {
  lastSay = t; window.__said.push(t);
  try {
    if (opt.soft && speechSynthesis.speaking) return;
    if (!opt.queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/[^\w\s!?,.']/g, ""));
    u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.2;
    const v = speechSynthesis.getVoices().find(v => /Samantha|Karen|Moira|Tessa|Google US English/.test(v.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
window.__said = [];
// ================= state =================
// scenes: walk -> hop -> brush -> floss -> rinse -> spit -> give -> home
let scene = "start", st = 0, time = 0, fade = 0, fadeDir = 0, fadeCb = null, idle = 0, nagT = 0;
let parts = [], foam = [], teeth = [], gaps = [], stars = 0;
let ptr = { x: 700, y: 650, down: false, px: 0, py: 0, seen: false };
let curly = { x: -120, y: 600, walk: 0, wag: 0, hop: 0 };
let water = 0, rinseHeld = 0, gave = false, giveT = 0, playAgain = false, flags = new Set(), happyT = 0;
const once = (k) => (flags.has(k) ? false : (flags.add(k), true));
const MX = 512, MY = 455, MRX = 215, MRY = 140;     // Curly's open mouth (close-up)
function makeTeeth() {
  teeth = []; gaps = [];
  for (let row = 0; row < 2; row++) for (let i = 0; i < 6; i++) {
    const u = (i - 2.5) / 2.5, x = MX + u * 150, y = row === 0 ? MY - MRY + 42 + u * u * 26 : MY + MRY - 42 - u * u * 26;
    teeth.push({ x, y, row, dirt: 1, clean: false, bug: Math.random() < 0.7, ph: Math.random() * 6, spots: [[rnd(-12, 12), rnd(-14, 14)], [rnd(-12, 12), rnd(-14, 14)]] });
  }
  for (let row = 0; row < 2; row++) for (let i = 0; i < 5; i++) {
    const a = teeth[row * 6 + i], b = teeth[row * 6 + i + 1];
    gaps.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, done: false });
  }
}
function fadeTo(cb) { fadeDir = 1; fadeCb = cb; }
function go(s) { scene = s; st = 0; idle = 0; nagT = 0; }
function resetGame() {
  parts = []; foam = []; stars = 0; water = 0; rinseHeld = 0; gave = false; giveT = 0; playAgain = false; flags.clear();
  curly = { x: -120, y: 600, walk: 0, wag: 0, hop: 0 }; makeTeeth(); go("walk"); songOn = true; if (ac) nextNote = ac.currentTime + 0.1;
  say("Curly is going to the dentist today!");
}
function burst(x, y, n, kind = "spark") {
  const cols = ["#ff5e7e", "#ffcc33", "#5cd65c", "#4db8ff", "#b77cff", "#ff9a3c"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(80, kind === "confetti" ? 520 : 300);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === "confetti" ? 300 : 60), life: rnd(0.8, 1.6), max: 1.6, kind, c: cols[i % 6], r: rnd(5, 11), rot: Math.random() * 6 });
  }
}
function bubble(x, y) { parts.push({ x, y, vx: rnd(-30, 30), vy: rnd(-90, -30), life: rnd(0.6, 1.2), max: 1.2, kind: "bubble", r: rnd(5, 13) }); }
function addFoam(x, y) {
  if (foam.length > 140) return;
  const dx = (x - MX) / MRX, dy = (y - MY) / MRY; if (dx * dx + dy * dy > 1.05) return;
  foam.push({ x: x + rnd(-18, 18), y: y + rnd(-18, 18), r: rnd(9, 20), a: 1 });
}
function curlyHappy(big) { happyT = 1.2; if (big) { sfx.woof(); } else if (Math.random() < 0.5) sfx.giggle(); else sfx.yip(); }
// ================= input =================
function toWorld(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
cv.addEventListener("pointerdown", e => { const p = toWorld(e); ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y; ptr.down = true; ptr.seen = true; tap(p); });
addEventListener("pointermove", e => { const p = toWorld(e); ptr.x = p.x; ptr.y = p.y; ptr.seen = true; });
addEventListener("pointerup", () => { ptr.down = false; });
addEventListener("pointercancel", () => { ptr.down = false; });
const near = (p, x, y, r) => Math.hypot(p.x - x, p.y - y) < r;
function tap(p) {
  if (scene === "walk" && st > 1.5 && near(p, curly.x, curly.y - 70, 170)) { startHop(); }
  else if (scene === "give" && !gave) { giveBrush(); }
  else if (scene === "home" && playAgain && near(p, W / 2, 380, 170)) { sfx.woof(); fadeTo(() => resetGame()); }
  else if (scene === "walk" || scene === "home" || scene === "spit") { curlyHappy(false); burst(p.x, p.y, 8); }
}
function startHop() { if (scene !== "walk") return; go("hop"); curly.hx0 = curly.x; sfx.boing(); say("Hop up, Curly!"); }
function giveBrush() { gave = true; giveT = 0; sfx.whoosh(); }
// ================= update =================
function update(dt) {
  time += dt; st += dt; idle += dt; nagT += dt; happyT = Math.max(0, happyT - dt);
  curly.wag += dt * (happyT > 0 ? 22 : 10);
  if (fadeDir) { fade = clamp(fade + fadeDir * dt * 2.2, 0, 1); if (fade >= 1 && fadeDir > 0) { fadeDir = -1; const c = fadeCb; fadeCb = null; c && c(); } if (fade <= 0 && fadeDir < 0) fadeDir = 0; }
  for (const q of parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.kind === "confetti") { q.vy += 500 * dt; q.vx *= 0.99; q.rot += dt * 6; } else if (q.kind === "drop") q.vy += 1400 * dt; else if (q.kind === "bubble") q.vx += Math.sin(time * 5 + q.r) * 4; else q.vy += 120 * dt; }
  parts = parts.filter(q => q.life > 0);
  const mv = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py); const moved = ptr.down ? mv : 0; ptr.px = ptr.x; ptr.py = ptr.y;
  if (scene === "walk") {
    if (curly.x < 420) { curly.x += 160 * dt; curly.walk += dt * 12; if (Math.random() < dt * 3) sfx.step(); }
    else if (once("arrive")) { curlyHappy(true); say("Tap Curly to help him hop into the dentist chair!", { queue: true }); }
    if (st > 11) startHop();
  } else if (scene === "hop") {
    const k = clamp(st / 0.9, 0, 1); curly.x = lerp(curly.hx0, 640, k); curly.y = lerp(600, 470, k) - Math.sin(k * Math.PI) * 160;
    if (k >= 1 && once("sat")) { curlyHappy(true); burst(640, 360, 20); say("You are the dentist! Curly, open wide! Ahhh!", { queue: true }); }
    if (st > 4.2 && once("toBrush")) fadeTo(() => { go("brush"); say("Rub the toothbrush on Curly's teeth. Scrub away the sugar bugs!"); });
  } else if (scene === "brush") {
    if (moved > 0) {
      let hit = false;
      for (const t of teeth) if (!t.clean && Math.hypot(ptr.x - t.x, ptr.y - t.y) < 75) {
        hit = true; t.dirt -= moved * 0.0045;
        if (t.dirt <= 0) { t.dirt = 0; t.clean = true; stars++; sfx.ding(stars); burst(t.x, t.y, 14); if (t.bug) burst(t.x, t.y, 4, "bug"); if (stars % 3 === 0) curlyHappy(false); }
      }
      if (hit || Math.random() < 0.3) { idle = 0; addFoam(ptr.x, ptr.y); if (Math.random() < 0.5) bubble(ptr.x, ptr.y); if (Math.random() < 0.25) sfx.scrub(); if (Math.random() < 0.012) sfx.giggle(); }
    }
    if (stars === 6 && once("half")) say("Great brushing! Keep going!", { soft: true });
    if (stars >= 12 && once("brushDone")) { sfx.yay(); burst(MX, MY, 40); curlyHappy(true); say("Sparkly clean! Now let's floss!"); flags.add("bd"); st = 0; }
    if (flags.has("brushDone") && st > 2.8 && once("toFloss")) { go("floss"); say("Slide the floss between Curly's teeth!", { queue: true }); }
    nag("Rub, rub, rub! Scrub the sugar bugs!", () => teeth.find(t => !t.clean));
  } else if (scene === "floss") {
    if (ptr.down) for (const g of gaps) if (!g.done && Math.hypot(ptr.x - g.x, ptr.y - g.y) < 55) {
      g.done = true; idle = 0; const n = gaps.filter(q => q.done).length; sfx.ping(n); burst(g.x, g.y, 10); if (n % 4 === 0) curlyHappy(false);
    }
    const n = gaps.filter(q => q.done).length;
    if (n >= gaps.length && once("flossDone")) { sfx.yay(); burst(MX, MY, 30); curlyHappy(true); say("Great flossing! Now rinse with water. Press and hold the cup!"); st = 0; }
    if (flags.has("flossDone") && st > 1.2 && once("toRinse")) go("rinse");
    if (!flags.has("flossDone")) nag("Slide the floss in the little spaces!", () => gaps.find(g => !g.done));
  } else if (scene === "rinse") {
    if (ptr.down && st > 0.3) {
      idle = 0; rinseHeld += dt; water = Math.min(1, water + dt * 0.6);
      if (Math.random() < dt * 8) sfx.water();
      for (let i = 0; i < 3; i++) foam.splice(Math.floor(Math.random() * foam.length), foam.length ? 1 : 0);
      if (Math.random() < dt * 3) sfx.gargle();
      for (let i = 0; i < 2; i++) parts.push({ x: MX + 120 + rnd(-6, 6), y: MY - 230, vx: rnd(-160, -110), vy: rnd(120, 220), life: 0.7, max: 0.7, kind: "drop", r: rnd(6, 10) });
    }
    if (rinseHeld > 2.2 && foam.length === 0 && once("rinseDone")) { sfx.gargle(); say("Swish, swish! Now spit, Curly!"); fadeTo(() => go("spit")); }
    nag("Press and hold the water cup!", () => null);
  } else if (scene === "spit") {
    if (st > 1.2 && once("spit1")) { sfx.spit(); for (let i = 0; i < 14; i++) parts.push({ x: 640 + 78, y: 410, vx: rnd(180, 300), vy: rnd(-260, -120), life: 1, max: 1, kind: "drop", r: rnd(5, 9) }); }
    if (st > 1.8 && once("splash")) { sfx.splash(); curlyHappy(false); say("Ptooey! Good spitting, Curly!", { queue: true }); }
    if (st > 4.2 && once("toGive")) fadeTo(() => { go("give"); say("Give Curly a brand new toothbrush! Tap the toothbrush!"); });
  } else if (scene === "give") {
    if (!gave && st > 9) giveBrush();
    if (gave) {
      giveT += dt;
      if (giveT > 0.8 && once("got")) { sfx.yay(); sfx.woof(); burst(700, 340, 70, "confetti"); burst(700, 360, 20); curlyHappy(true); say("Good job, Curly!"); say("What a sparkly smile!", { queue: true }); }
      if (giveT > 0.8 && Math.random() < dt * 4) burst(rnd(150, 900), rnd(60, 200), 6, "confetti");
      if (giveT > 6 && once("toHome")) fadeTo(() => { go("home"); curly.x = 60; curly.y = 715; say("Curly goes home happy! Hop, hop, hop!"); });
    }
  } else if (scene === "home") {
    if (curly.x < 740) { curly.x += 150 * dt; curly.y = lerp(715, 612, clamp(curly.x / 740, 0, 1)); curly.walk += dt * 10; curly.hop = Math.abs(Math.sin(st * 5)) * 50; if (Math.random() < dt * 1.2) sfx.yip(); }
    else { curly.hop *= 0.85; if (once("home")) { sfx.door(); curlyHappy(true); burst(760, 500, 40, "confetti"); say("Curly is home! Bye bye, dentist! See you next time!"); } }
    if (flags.has("home") && !playAgain && st > 0) { if (!flags.has("pa")) { flags.add("pa"); curly.paT = st; } if (st - curly.paT > 3) playAgain = true; }
  }
}
function nag(line, target) {
  if (idle > 6 && nagT > 9) { nagT = 0; say(line, { soft: true }); }
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill(); }
function emoji(ch, x, y, size, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, 0, 0); ctx.restore();
}
function text(s, x, y, size, c, align = "center") { ctx.font = `bold ${size}px "Chalkboard SE","Comic Sans MS",sans-serif`; ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); }
// Curly: little fluffy black dog (from Curly's Pineapples), with a red collar
function drawCurly(x, y, d, o = {}) {
  ctx.save();
  if (o.spin) { ctx.translate(x, y - 55); ctx.rotate(Math.sin(o.spin) * 0.35); ctx.translate(-x, -(y - 55)); }
  const walk = o.walk || 0, lying = !!o.lying;
  const leg = Math.sin(walk) * 11;
  if (!lying) {
    for (const [dx, s] of [[-28, 1], [-14, -1], [18, 1], [32, -1]]) {
      ctx.save(); ctx.translate(x + dx, y - 30);
      ctx.rotate(o.air ? (dx < 0 ? 0.7 : -0.7) * d : s * leg * 0.05);
      rrect(-6, 0, 12, 30, 5, "#151515"); ctx.restore();
    }
  }
  const by = lying ? y - 26 : y - 52 - (o.run ? Math.abs(Math.sin(walk)) * 5 : 0);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; circle(x + Math.cos(a) * 40, by + Math.sin(a) * 20, 17, "#1c1c1c"); }
  ellipse(x, by, 46, 26, "#222");
  for (let i = 0; i < 7; i++) circle(x - 30 + i * 10, by - 8 + (i % 2) * 8, 5, "#333");
  const wag = Math.sin(o.wag || 0) * 0.6;
  ctx.save(); ctx.translate(x - 44 * d, by - 10); ctx.rotate(-0.8 * d + wag);
  circle(0, -14, 9, "#1c1c1c"); circle(0, -26, 8, "#1c1c1c"); ctx.restore();
  const hx = x + 46 * d, hy = by - (lying ? 14 : 30);
